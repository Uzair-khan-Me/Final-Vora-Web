# Railway Config as Code
# https://docs.railway.com/config-as-code
#
# Connect this repo in Railway (New Project → Deploy from GitHub repo).
# Railway builds the root Dockerfile, injects PORT, and probes /api/health.
#
# After the first deploy:
#   1. Networking → Generate Domain
#   2. Set NEXT_PUBLIC_SITE_URL=https://${{RAILWAY_PUBLIC_DOMAIN}}
#   3. Redeploy so build-time canonical metadata uses the public origin
#
# Keep a single replica. Jobs and rate limits live in memory.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
overlapSeconds = 0
drainingSeconds = 30
